<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tasks prototype A</title>
<link rel="stylesheet" href="../vendor/fonts.css">
<link rel="stylesheet" href="../space.css">
<style>html, body { min-height: 100%; margin: 0; background: #050507; color: #f2f2f5; -webkit-font-smoothing: antialiased; }
.tka-page { max-width: 880px; margin: 0 auto; padding: 24px 16px 48px; box-sizing: border-box; }
.tka-panel { padding: 22px 20px 18px; font-family: var(--sk-font-title); overflow: hidden; }
.tka-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
.tka-head h1 { margin: 0; }
.tka-count, .tka-num, .tka-c-num, .tka-c-n { font-family: var(--sk-font-mono); font-variant-numeric: tabular-nums; }
.tka-count { font-size: 12px; color: var(--sk-text-2); }
.tka-table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 14px; }
.tka-table th { font: 400 10.5px var(--sk-font-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--sk-text-3); text-align: left; padding: 0 8px 8px; border-bottom: 1px solid var(--sk-line); }
.tka-table th:first-child, .tka-c-mark { width: 28px; padding-right: 0; text-align: center; }
.tka-table th:nth-child(2), .tka-c-n { width: 34px; color: var(--sk-text-3); }
.tka-table .tka-c-who { width: 130px; color: var(--sk-text-2); overflow-wrap: anywhere; }
.tka-table .tka-c-num { width: 56px; text-align: right; }
.tka-table td { padding: 9px 8px; vertical-align: top; }
.tka-c-title { overflow-wrap: anywhere; }
.tka-row { cursor: pointer; border-bottom: 1px solid var(--sk-line); transition: background .2s; }
.tka-row:hover, .tka-row:focus-visible { background: rgba(255, 255, 255, .05); outline: none; }
.tka-row:focus-visible { box-shadow: inset 0 0 0 1.5px var(--st-lead); }
.tka-task--waiting .tka-row { color: var(--sk-text-3); }
.tka-task--done .tka-c-title { color: var(--sk-text-2); }
.tka-mark { display: inline-flex; width: 16px; height: 16px; align-items: center; justify-content: center; font-size: 15px; line-height: 1; }
.tka-mark--done { color: var(--st-done); filter: drop-shadow(0 0 5px color-mix(in srgb, var(--st-done) 60%, transparent)); }
.tka-mark--review { color: var(--st-waiting); }
.tka-mark--working { color: var(--st-working); }
.tka-spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid color-mix(in srgb, currentColor 25%, transparent); border-top-color: currentColor; animation: tka-spin .8s linear infinite; }
.tka-mark.is-still .tka-spin { animation: none; border-top-color: color-mix(in srgb, currentColor 25%, transparent); }
@keyframes tka-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .tka-spin { animation: none; border-top-color: currentColor; border-right-color: currentColor; } }
.tka-detail td { padding: 4px 8px 14px 36px; background: rgba(255, 255, 255, .03); border-bottom: 1px solid var(--sk-line); }
.tka-work, .tka-events { list-style: none; margin: 0; padding: 0; font-size: 13px; }
.tka-work li { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 4px 0; }
.tka-w-who { min-width: 110px; }
.tka-w-role, .tka-w-step { color: var(--sk-text-2); }
.tka-w-step { min-width: 44px; }
.tka-num { color: var(--sk-text-2); font-size: 12px; }
.tka-events { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--sk-line); color: var(--sk-text-2); }
.tka-events time { font-family: var(--sk-font-mono); color: var(--sk-text-3); margin-right: 4px; }
.tka-none { margin: 0; color: var(--sk-text-3); font-size: 13px; }
.tka-table tfoot td { padding-top: 12px; font-weight: 600; border-top: 1px solid var(--sk-line); }
.tka-foot { margin: 12px 0 0; font-size: 12px; color: var(--sk-text-3); }
.tka-note, .tka-offline { margin: 6px 0 14px; color: var(--sk-text-2); font-size: 14px; }
.tka-note--error { color: var(--st-failed); }
.tka-offline { padding: 8px 12px; border-radius: 12px; background: color-mix(in srgb, var(--st-waiting) 14%, transparent); color: var(--st-waiting); }
@media (max-width: 520px) {
  .tka-panel { padding: 18px 12px 14px; }
  .tka-table .tka-c-who { width: 74px; font-size: 12px; padding-left: 4px; padding-right: 4px; }
  .tka-table th:first-child, .tka-c-mark { width: 24px; padding-left: 0; }
  .tka-table th:nth-child(2), .tka-c-n { width: 22px; padding: 9px 2px; }
  .tka-table .tka-c-num { width: 40px; padding-left: 4px; padding-right: 4px; }
  .tka-table { font-size: 13px; }
  .tka-detail td { padding-left: 12px; }
}
</style>
</head>
<body class="dark">
<!-- Prototype only, variant A (docs/specs/task-sidebar.md, phase 3). Removed in phase 6. -->
<div id="root"></div>
<script type="module" src="./tasks-a.js"></script>
</body>
</html>
