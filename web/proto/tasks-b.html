<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tasks prototype B</title>
<link rel="stylesheet" href="../vendor/fonts.css">
<link rel="stylesheet" href="../space.css">
<style>
html, body { min-height: 100%; margin: 0; background: #050507; color: #f2f2f5; -webkit-font-smoothing: antialiased; }
.tb-page { position: relative; z-index: 1; max-width: 880px; margin: 0 auto; padding: 24px 16px 48px; box-sizing: border-box; font-family: var(--sk-font-title); }
.tb-panel { padding: 24px; min-width: 0; }
.tb-panel__title { margin: 0 0 16px; font: 700 28px var(--sk-font-title); letter-spacing: -0.02em; }
.tb-offline { margin: 0 0 12px; padding: 10px 16px; border-radius: 18px; background: rgba(255, 181, 71, 0.14); color: var(--st-waiting); font-size: 13.5px; }
.tb-note { color: var(--sk-text-2); display: flex; gap: 10px; align-items: center; margin: 8px 0; }
.tb-note--error { color: var(--st-failed); }
.tb-muted { color: var(--sk-text-2); font-size: 13px; }
.tb-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.tb-count { font-family: var(--sk-font-mono); font-size: 12px; opacity: 0.7; }
.tb-scroll { max-width: 100%; overflow-x: hidden; }
.tb-table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 14px; }
.tb-table th { font: 500 11.5px var(--sk-font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--sk-text-3); text-align: left; padding: 6px 8px; }
.tb-table td { padding: 10px 8px; border-top: 1px solid var(--sk-line); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tb-table .tb-group th { padding-top: 16px; color: var(--sk-text-2); }
.tb-c-mark { width: 32px; text-overflow: clip !important; } /* a 16px mark must fit the cell, or the ellipsis draws a dot */ .tb-c-n { width: 36px; color: var(--sk-text-3); font-family: var(--sk-font-mono); }
.tb-c-who { width: 110px; color: var(--sk-text-2); } .tb-c-num { width: 64px; text-align: right !important; font-family: var(--sk-font-mono); font-variant-numeric: tabular-nums; }
.tb-who-inline { display: none; color: var(--sk-text-2); font-size: 12px; margin-left: 8px; }
.tb-row { cursor: pointer; transition: background 0.2s var(--sk-ease); }
.tb-row:hover, .tb-row.is-open { background: rgba(255, 255, 255, 0.06); }
.tb-row:focus-visible { outline: 2px solid var(--st-lead); outline-offset: -2px; }
.tb-row--working .tb-title, .tb-row--review .tb-title { font-weight: 600; }
.tb-row--waiting { color: var(--sk-text-2); }
.tb-total td { border-top: 1px solid rgba(255, 255, 255, 0.22); font-weight: 600; padding-top: 12px; }
.tb-foot { margin: 14px 0 0; font-size: 12.5px; color: var(--sk-text-3); }
.tb-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.tb-mark { display: inline-block; width: 16px; height: 16px; vertical-align: -3px; box-sizing: border-box; }
.tb-spin { border: 2px solid rgba(61, 123, 255, 0.28); border-top-color: var(--st-working); border-radius: 50%; animation: tb-spin 0.8s linear infinite; }
.tb-half { border: 2px solid var(--st-waiting); border-radius: 50%; background: linear-gradient(90deg, var(--st-waiting) 50%, transparent 50%); }
.tb-ring { border: 2px solid var(--sk-text-3); border-radius: 50%; }
.tb-check { fill: none; stroke: var(--st-done); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 16; animation: tb-draw 0.5s var(--sk-ease) both; }
.tb-scrim { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, 0.45); display: flex; justify-content: flex-end; }
.tb-drawer { width: min(420px, 100%); height: 100%; overflow-y: auto; box-sizing: border-box; padding: 24px; background: linear-gradient(180deg, #11111a, #08080e); box-shadow: -24px 0 64px -24px rgba(0, 0, 0, 0.8), inset 1px 0 0 var(--sk-line); animation: tb-in 0.3s var(--sk-ease); }
.tb-drawer__head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.tb-drawer__status { font: 500 12px var(--sk-font-mono); color: var(--sk-text-2); text-transform: uppercase; letter-spacing: 0.08em; }
.tb-drawer__title { margin: 8px 0 0; font: 600 20px/1.25 var(--sk-font-title); overflow-wrap: anywhere; }
.tb-x { flex: none; width: 36px; height: 36px; border: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.08); color: inherit; font-size: 15px; cursor: pointer; }
.tb-x:focus-visible { outline: 2px solid var(--st-lead); }
.tb-h { margin: 24px 0 8px; font: 500 11.5px var(--sk-font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--sk-text-3); }
.tb-work, .tb-time { list-style: none; margin: 0; padding: 0; }
.tb-work__line { padding: 10px 0; border-top: 1px solid var(--sk-line); }
.tb-work__top { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.tb-work__nums { display: flex; gap: 14px; margin: 4px 0 8px; font: 13px var(--sk-font-mono); color: var(--sk-text-2); flex-wrap: wrap; }
.tb-share { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
.tb-share span { display: block; height: 100%; background: var(--st-working); border-radius: 3px; }
.tb-time li { padding: 6px 0; font-size: 14px; } .tb-time .tb-muted { font-family: var(--sk-font-mono); margin-right: 8px; }
.is-offline .tb-spin { animation: none; border-top-color: var(--st-idle); }
@keyframes tb-spin { to { transform: rotate(360deg); } }
@keyframes tb-draw { from { stroke-dashoffset: 16; } to { stroke-dashoffset: 0; } }
@keyframes tb-in { from { transform: translateX(32px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes tb-up { from { transform: translateY(32px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .tb-spin, .tb-check, .tb-drawer { animation: none !important; } }
@media (max-width: 600px) {
  .tb-panel { padding: 16px; }
  .tb-c-who { display: none; } .tb-who-inline { display: block; margin: 2px 0 0; }
  .tb-c-mark { width: 28px; } .tb-c-n { width: 24px; } .tb-c-num { width: 42px; } .tb-table td, .tb-table th { padding-left: 4px; padding-right: 4px; }
  .tb-table .tb-c-title { white-space: normal; }
  .tb-scrim { align-items: flex-end; }
  .tb-drawer { width: 100%; height: auto; max-height: 82vh; border-radius: 28px 28px 0 0; animation-name: tb-up; box-shadow: 0 -24px 64px -24px rgba(0, 0, 0, 0.8); }
}
</style>
</head>
<body class="dark">
<!-- Prototype only, variant B (docs/specs/task-sidebar.md, phase 3). Removed in phase 6. -->
<div id="root"></div>
<script type="module" src="./tasks-b.js"></script>
</body>
</html>
